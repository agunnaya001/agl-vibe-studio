name: AGL Studio Recovery Checks

on:
  push:
    branches:
      - recovery/agl-studio-production-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agl-studio-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
