name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  statuses: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run lint

  notify-vercel:
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 'notify vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: Vercel - agl-vibe-studio: lint
